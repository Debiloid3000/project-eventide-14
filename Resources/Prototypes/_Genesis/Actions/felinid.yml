- type: entity
  parent: BaseAction
  id: ActionEatMouse
  name: genesis-action-name-eat-mouse
  description: genesis-action-description-eat-mouse
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
  - type: InstantAction
    event: !type:EatMouseActionEvent

- type: entity
  parent: BaseAction
  id: ActionHairball
  name: genesis-action-name-hairball
  description: genesis-action-description-hairball
  components:
  - type: LimitedCharges
    maxCharges: 1
  - type: Action
    checkCanInteract: false
    #icon: { sprite: Backmen/Structures/web.rsi, state: web1 }
    useDelay: 30
  - type: InstantAction
    event: !type:HairballActionEvent

- type: entity
  parent: BaseAction
  id: ActionWoundLicking
  name: genesis-action-name-wound-licking
  description: genesis-action-description-wound-licking
  components:
  - type: Action
    priority: -1
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    layers:
    - state: tongue
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - HumanoidProfile
    event: !type:WoundLickingActionEvent
