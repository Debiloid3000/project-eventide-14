- type: entity
  parent: BaseAction
  id: SwitchNightVision
  name: genesis-action-name-switch-night-vision
  description: genesis-action-description-switch-night-vision
  components:
  - type: Action
    useDelay: 2.5
  - type: Sprite
    sprite: Clothing/Eyes/Glasses/ninjavisor.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleNightVisionEvent

- type: entity
  parent: BaseAction
  id: NVToggleAction
  name: genesis-action-name-toggle-nvd
  description: genesis-action-description-toggle-nvd
  components:
  - type: Action
    useDelay: 2.5
  - type: Sprite
    sprite: Clothing/Eyes/Glasses/ninjavisor.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleNightVisionEvent
