- type: entity
  parent: BaseAction
  id: SwitchNightVision
  name: switch night vision
  description: Switches night vision
  components:
  - type: Action
    useDelay: 2.5
  - type: Sprite
    sprite: Clothing/Eyes/Glasses/ninjavisor.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleNightVisionEvent

- type: entity
  parent: BaseAction
  id: NVToggleAction
  name: toggle nvd
  description: Toggles your NVD
  components:
  - type: Action
    useDelay: 2.5
  - type: Sprite
    sprite: Clothing/Eyes/Glasses/ninjavisor.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleNightVisionEvent
