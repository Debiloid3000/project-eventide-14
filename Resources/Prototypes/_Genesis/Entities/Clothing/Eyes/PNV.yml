- type: entity
  name: NVD
  id: ClothingEyesVision
  parent: BaseItem
  description: Night vision device. Provides an image of the terrain in low-light conditions.
  components:
  - type: Item
  - type: Sprite
    sprite: Clothing/Eyes/Glasses/ninjavisor.rsi
    state: icon
  - type: Clothing
    sprite: Clothing/Eyes/Glasses/ninjavisor.rsi
    quickEquip: true
    slots: [ Eyes ]
  - type: NightVision
    enabled: false
    relayOverlay: true
    action: NVToggleAction

# Genesis-Edit: the original NVD above keeps the default lighting behavior.
- type: entity
  parent: ClothingEyesVision
  id: ClothingEyesVisionGreen
  name: green night vision device
  description: Night vision device that renders its view with a green tint.
  components:
  - type: NightVision
    overlayColor: "#00FF0030"
    disableLighting: true
