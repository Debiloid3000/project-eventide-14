# Uma use human anatomy and body proportions. Only the head and torso marking groups differ,
# so the race keeps the regular human-sized humanoid body instead of the shorter Felinid frame.
- type: markingsGroup
  parent: Human
  id: Uma
  limits:
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [UmaEarsDefault]
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [UmaTailDefault]

- type: entity
  parent: AppearanceHuman
  id: AppearanceUma
  categories: [ HideSpawnMenu ]
  name: uma appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganUmaTorso
      Head: OrganUmaHead
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandRight: OrganHumanHandRight
      HandLeft: OrganHumanHandLeft
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Uma

- type: entity
  parent: [AppearanceUma, BaseSpeciesMobOrganic]
  id: MobUma
  name: Urist Equus
  components:
  - type: UmaDiet

- type: entity
  parent: OrganHumanHead
  id: OrganUmaHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.FacialHair
    markingData:
      group: Uma

- type: entity
  parent: OrganHumanTorso
  id: OrganUmaTorso
  components:
  - type: VisualOrganMarkings
    markingData:
      group: Uma
