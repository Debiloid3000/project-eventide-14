name: "Labels: Size"

# This workflow only reads pull-request metadata and applies a size label.
# pull_request keeps the token scoped to the PR run instead of relying on
# pull_request_target's base-branch workflow definition.
permissions:
  contents: read
  issues: write
  pull-requests: write

on: pull_request
jobs:
  size-label:
    runs-on: ubuntu-latest
    steps:
      - name: size-label
        uses: "pascalgn/size-label-action@v0.5.5"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          sizes: >
            {
              "0": "XS",
              "10": "S",
              "100": "M",
              "1000": "L",
              "5000": "XL"
            }
