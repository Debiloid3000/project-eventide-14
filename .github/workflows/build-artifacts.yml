name: Build Artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server packages (Windows, Linux, macOS)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run repository build setup
        run: python3 RUN_THIS.py

      - name: Restore dependencies
        run: dotnet restore

      - name: Build packaging tool
        run: dotnet build Content.Packaging --configuration Release --no-restore /m

      # Avoid --hybrid-acz: it embeds the full client ZIP into every server archive.
      # The runnable client is distributed separately by the client job.
      - name: Package server for all supported desktop platforms
        run: >
          dotnet run --project Content.Packaging
          --configuration Release
          --no-build --
          server
          --platform win-x64
          --platform linux-x64
          --platform linux-arm64
          --platform osx-x64
          --platform osx-arm64

      - name: Verify server packages
        shell: bash
        run: |
          set -euo pipefail
          for rid in win-x64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            archive="release/SS14.Server_${rid}.zip"
            test -s "$archive"
            if unzip -Z1 "$archive" | grep -qE '(^|/)Content.Client.zip$'; then
              echo "::error::Unexpected embedded client ZIP in $archive"
              exit 1
            fi
          done
          echo "Server archive sizes (client is distributed separately):"
          ls -lh release/SS14.Server_*.zip

      - name: Upload server packages
        uses: actions/upload-artifact@v4
        with:
          name: SS14.Server_${{ github.sha }}
          path: |
            release/SS14.Server_win-x64.zip
            release/SS14.Server_linux-x64.zip
            release/SS14.Server_linux-arm64.zip
            release/SS14.Server_osx-x64.zip
            release/SS14.Server_osx-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  client:
    name: Client packages (Windows, Linux, macOS)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run repository build setup
        run: python3 RUN_THIS.py

      - name: Build runnable clients for all supported platforms
        shell: bash
        env:
          DOTNET_CLI_USE_MSBUILD_SERVER: "0"
        run: |
          set -euo pipefail

          mkdir -p release/client-packages

          for rid in win-x64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            case "$rid" in
              win-x64)
                target_os="Windows"
                apphost="Content.Client.exe"
                ;;
              linux-x64|linux-arm64)
                target_os="Linux"
                apphost="Content.Client"
                ;;
              osx-x64|osx-arm64)
                target_os="MacOS"
                apphost="Content.Client"
                ;;
            esac

            echo "::group::Build client for $rid"
            dotnet restore Content.Client/Content.Client.csproj --runtime "$rid"

            # One platform at a time: no matrix workers or concurrent writers can
            # race on shared RobustToolbox runtime configuration files.
            dotnet build Content.Client/Content.Client.csproj \
              --configuration Release \
              --runtime "$rid" \
              --no-restore \
              --disable-build-servers \
              -m:1 \
              /nodeReuse:false \
              /p:UseSharedCompilation=false \
              "/p:TargetOs=$target_os" \
              "/p:RuntimeIdentifier=$rid" \
              /p:AppendRuntimeIdentifierToOutputPath=false \
              /p:SelfContained=false \
              /p:FullRelease=false

            CLIENT_DIR="bin/Content.Client"
            test -s "$CLIENT_DIR/$apphost"
            for assembly in \
              Content.Client.dll \
              Content.Shared.dll \
              Content.Shared.Database.dll \
              Content.Corvax.Interfaces.Client.dll \
              Content.Corvax.Interfaces.Shared.dll; do
              test -s "$CLIENT_DIR/$assembly" || {
                echo "::error::Missing required client assembly for $rid: $CLIENT_DIR/$assembly"
                exit 1
              }
            done

            PACKAGE_DIR="$PWD/release/client-packages/$rid"
            mkdir -p "$PACKAGE_DIR/bin"
            cp -a "$CLIENT_DIR" "$PACKAGE_DIR/bin/Content.Client"
            cp -a Resources "$PACKAGE_DIR/Resources"

            if [[ "$rid" == "win-x64" ]]; then
              cat > "$PACKAGE_DIR/run_client.bat" <<'EOF'
          @echo off
          cd /d "%~dp0bin\Content.Client"
          Content.Client.exe
          pause
          EOF
            else
              chmod +x "$PACKAGE_DIR/bin/Content.Client/$apphost"
              cat > "$PACKAGE_DIR/run_client.sh" <<'EOF'
          #!/usr/bin/env bash
          set -e
          SCRIPT_DIR="$(cd -- "$(dirname -- "$0")" && pwd)"
          cd "$SCRIPT_DIR/bin/Content.Client"
          exec ./Content.Client
          EOF
              chmod +x "$PACKAGE_DIR/run_client.sh"
            fi

            cat > "$PACKAGE_DIR/README.txt" <<EOF
          EVENTIDE LOCAL CLIENT ($rid)

          1. Extract the complete archive, preserving its folders.
          2. Windows: run run_client.bat.
             Linux/macOS: run ./run_client.sh.
          3. Start the matching SS14.Server package separately.
          4. In the client, use Direct Connect and enter: localhost:1212

          Keep the Resources folder beside the bin folder.
          This is a runnable Content.Client build, not the launcher's resource-only Content ZIP.
          Requires the .NET 10 runtime for this platform.
          EOF

            (cd "$PACKAGE_DIR" && zip -qr "$PWD/../../SS14.Client_$rid.zip" .)
            test -s "release/SS14.Client_$rid.zip"
            rm -rf "$PACKAGE_DIR"
            echo "::endgroup::"
          done

      - name: Verify all client packages
        shell: bash
        run: |
          set -euo pipefail
          for rid in win-x64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            test -s "release/SS14.Client_${rid}.zip"
          done
          ls -lh release/SS14.Client_*.zip

      - name: Upload all client packages
        uses: actions/upload-artifact@v4
        with:
          name: SS14.Client_${{ github.sha }}
          path: |
            release/SS14.Client_win-x64.zip
            release/SS14.Client_linux-x64.zip
            release/SS14.Client_linux-arm64.zip
            release/SS14.Client_osx-x64.zip
            release/SS14.Client_osx-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
