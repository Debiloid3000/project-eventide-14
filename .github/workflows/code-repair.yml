name: Auto Repair Workflow

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: .repair_cache
          key: repair-repos-Linux-${{ hashFiles('auto_repair.py') }}

      - name: Run Auto Repair Engine
        id: repair_step
        shell: bash
        run: python auto_repair.py

      - name: Upload Logs & Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-artifacts
          path: |
            reports/
            logs/

      - name: Create Pull Request
        if: steps.repair_step.outputs.has_fixes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto-repair-fixes
          title: "🔧 Auto-Repair Engine Updates"
          commit-message: "chore: auto-repair old engine incompatibilities"
          body: "Автоматические исправления успешны и проверены сборкой `dotnet build`."
