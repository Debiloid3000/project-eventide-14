name: Auto Repair Workflow

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: .repair_cache
          key: repair-repos-Linux-${{ hashFiles('repair_engine.py') }}

      - name: Run Auto Repair Engine
        id: repair_step
        shell: bash
        run: python repair_engine.py

      - name: Check real project changes
        id: diff_check
        shell: bash
        run: |
          git status --porcelain --untracked-files=all > status.txt || true
          grep -vE '(^\s*$|\.repair_cache/|logs/|reports/|auto-repair-fixes/)' status.txt > filtered_status.txt || true
          grep -E '\.(cs|csproj|sln|slnx|props|targets)$' filtered_status.txt > real_project_changes.txt || true
          if [ -s real_project_changes.txt ]; then
            echo "has_project_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Logs & Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-artifacts
          path: |
            reports/
            logs/

      - name: Create Pull Request
        if: steps.repair_step.outputs.has_fixes == 'true' && steps.diff_check.outputs.has_project_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto-repair-fixes
          title: "🔧 Auto-Repair Engine Updates"
          commit-message: "chore: auto-repair old engine incompatibilities"
          body: "Автоматические исправления успешны и проверены сборкой `dotnet build`."
