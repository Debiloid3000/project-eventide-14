name: SS14 Code Repair Engine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (check = read only, repair = apply fixes)'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - repair

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Нужна полная история

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # SS14 использует .NET 8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install -r requirements-repair.txt

      - name: Cache Reference Repositories
        uses: actions/cache@v4
        with:
          path: .repair_cache
          key: repair-repos-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            repair-repos-${{ runner.os }}-

      - name: Run Repair Engine (Dry Run)
        if: ${{ inputs.mode == 'check' }}
        run: python3 repair_engine.py --dry-run

      - name: Run Repair Engine (Auto Fix)
        if: ${{ inputs.mode == 'repair' }}
        run: python3 repair_engine.py

      - name: Upload Repair Reports
        uses: actions/upload-artifact@v4
        with:
          name: repair-reports
          path: reports/

      - name: Create Pull Request
        if: ${{ inputs.mode == 'repair' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: Auto-repair old engine incompatibilities"
          title: "🔧 Auto-Repair Engine Updates"
          body: |
            ## SS14 Autonomous Code Repair
            This PR was generated by the Repair Engine. 
            Check `reports/summary.json` in the artifacts for details on the fixes.
          branch: "auto-repair-fixes"
